name: CI api
on:
  pull_request:
    paths: ['api/**', 'docs/api-spec.yaml', '.github/workflows/ci-api.yml']
  push:
    branches: [develop, main]
    paths: ['api/**']
defaults:
  run:
    working-directory: api
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: farmai, POSTGRES_PASSWORD: farmai, POSTGRES_DB: farmai_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U farmai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://farmai:farmai@localhost:5432/farmai_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
      - run: npm test
