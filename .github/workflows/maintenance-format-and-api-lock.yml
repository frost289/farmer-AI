name: Maintenance format and API lockfile

on:
  push:
    branches: [fix/web-auth-cache-isolation]
    paths:
      - '.github/workflows/maintenance-format-and-api-lock.yml'

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-auth-cache-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format AI service Python files
        run: |
          pip install black==24.10.0
          black ai-services/advisory ai-services/vision ai-services/speech
      - name: Generate API lockfile
        working-directory: api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-services/advisory ai-services/vision ai-services/speech api/package-lock.json
          if git diff --cached --quiet; then
            echo "No maintenance changes required."
          else
            git commit -m "chore: format AI services and lock API dependencies"
            git push
          fi
