name: CI ai-services
on:
  pull_request:
    paths: ['ai-services/**', 'docs/label-taxonomy.json', '.github/workflows/ci-ai.yml']
  push:
    branches: [develop, main]
    paths: ['ai-services/**']
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [advisory, vision, speech]
    defaults:
      run:
        working-directory: ai-services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: 'ai-services/${{ matrix.service }}/requirements.txt' }
      - run: pip install -r requirements.txt ruff black pytest httpx
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
        continue-on-error: ${{ matrix.service == 'speech' }}
